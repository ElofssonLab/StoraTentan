project:
  type: book
  output-dir: _book
  pre-render: python3 scripts/make_papers.py
  resources:
    - papers/open/*.pdf

book:
  title: "Stora Tentan in Bioinformatics"
  subtitle: "Reading guide for the oral PhD exam at DBB, Stockholm University"
  author: "Arne Elofsson"
  date: last-modified
  license: "CC BY-SA"
  chapters:
    - index.qmd
    - part: "Topics"
      chapters:
        - chapters/01-sequence-searching.qmd
        - chapters/02-databases.qmd
        - chapters/03-evolution.qmd
        - chapters/04-phylogeny.qmd
        - chapters/05-genomics.qmd
        - chapters/06-genomes.qmd
        - chapters/07-expression.qmd
        - chapters/08-proteomics.qmd
        - chapters/09-protein-structure.qmd
        - chapters/10-protein-function.qmd
        - chapters/11-protein-interactions.qmd
        - chapters/12-machine-learning.qmd
    - references.qmd
  appendices:
    - chapters/textbooks.qmd

bibliography: references.bib
link-citations: true

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    number-sections: false
    reference-location: margin
    citation-location: document
  pdf:
    documentclass: scrreprt
    papersize: a4
    geometry:
      - margin=25mm
    fontsize: 11pt
    mainfont: Libertinus Serif
    sansfont: Libertinus Sans
    mathfont: Libertinus Math
    toc-depth: 2
    number-sections: true
    colorlinks: true
    include-in-header: preamble.tex
